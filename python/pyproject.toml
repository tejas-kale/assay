# Assay's Python environment, venv-assay. `claude-pkg venv-assay` (on the Mac, from any directory) builds it from
# this file and uv.lock (in ~/Code/assay/python) into the Podman volume venv-assay, which sessions mount at
# /opt/venv-assay: rerun it after changing this file, and commit the new uv.lock.
# (tests/test_venv.sh builds this file with uv in a scratch folder.)

[project]
name = "notes-src"
version = "0"
requires-python = ">=3.10"
dependencies = [
  "ipykernel",
  "pytest",
  "databricks-sdk",
  "databricks-sqlalchemy>=2,<3",
  "databricks-sql-connector",
  "polars",
  "pandas",
  "pyarrow",
  "duckdb",
  # analysis_trust and analysis_sql: SQL parsing, the SQL rules and transpiling, the dictionary's and calculations' YAML.
  "sqlglot",
  "pyyaml",
  # A SQLAlchemy engine on DuckDB, for Python calculations' fixture tests (analysis_trust.fixture_engine).
  "duckdb-engine",
  "altair",
  "matplotlib",
]

# The project installs itself, editable, so `import analysis_db` (and the server's `python -m analysis_trust`)
# works from any analysis folder, whatever is on sys.path.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["analysis_db", "analysis_trust", "analysis_sql"]
packages = []


# The check's tools (npm run check): ruff for lint, pytest-cov for coverage, pytest-xdist to run the tests in
# parallel. Not shipped with the app.
[dependency-groups]
dev = ["ruff", "pytest-cov", "pytest-xdist"]

# The smell gate (docs/process/coding-standards.md). Today's violations are counted in ruff-baseline.json, which the
# ratchet (scripts/ratchet.ts) lets only shrink.
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C90", "PL", "SIM", "RUF", "UP", "N"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 40

# Coverage of the helpers, not the tests. The kernel and `python -m analysis_*` run as subprocesses in the tests, so
# coverage follows subprocesses.
[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/tests/*"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
# A helper in a folder without __init__.py still counts, at 0% if no test runs it.
include_namespace_packages = true
