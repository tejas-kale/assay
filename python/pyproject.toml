# Assay's Python environment. The app builds it at launch with `uv sync --frozen --no-editable --no-dev` from this file and
# uv.lock (shipped in the app under backend/python) into ~/Library/Application Support/assay/venvs/<version>, and
# passes it to Claude in ASSAY_VENV (docs/developer/launch-contract.md). After changing this file, run `uv lock` and
# commit the new uv.lock: the next release builds it. (tests/test_venv.sh builds this file with uv in a scratch folder.)

[project]
name = "notes-src"
version = "0"
# 3.11 at least: on 3.10 the lock can only hold Pillow and Tornado releases with known vulnerabilities (pip-audit).
requires-python = ">=3.11"
dependencies = [
  "ipykernel",
  "pytest",
  "databricks-sdk",
  "databricks-sqlalchemy>=2,<3",
  "databricks-sql-connector",
  "polars",
  "pandas",
  "pyarrow",
  "duckdb",
  # analysis_trust and analysis_sql: SQL parsing, the SQL rules and transpiling, the dictionary's and calculations' YAML.
  "sqlglot",
  "pyyaml",
  # A SQLAlchemy engine on DuckDB, for Python calculations' fixture tests (analysis_fixtures.fixture_engine).
  "duckdb-engine",
  "altair",
  "matplotlib",
]

# The project installs itself, editable, so `import analysis_db` (and the server's `python -m analysis_trust`)
# works from any analysis folder, whatever is on sys.path.
# The backend is pinned here and in [tool.uv] below: it runs on every user's Mac when the app builds its venv, and uv
# fetches it outside uv.lock.
[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "analysis_db",
  "analysis_imports",
  "analysis_sql",
  "analysis_sqlread",
  "analysis_lint",
  "analysis_lineage",
  "analysis_steps",
  "analysis_include",
  "analysis_retype",
  "analysis_trust",
  "analysis_calc",
  "analysis_dictionary",
  "analysis_library",
  "analysis_ledger",
  "analysis_runner",
  "analysis_fixtures",
  "analysis_pytest",
  "analysis_blocks",
  "analysis_review",
  "analysis_child",
  "analysis_kernel_preload",
  "analysis_kernel_run",
  "analysis_kernel_serve",
]
packages = []


# The check's tools (npm run check): ruff for lint, pytest-cov for coverage, pytest-xdist to run the tests in
# parallel. Not shipped with the app.
[dependency-groups]
dev = ["ruff", "pytest-cov", "pytest-xdist"]

[tool.uv]
build-constraint-dependencies = ["setuptools==84.2.1"]

# The smell gate (docs/developer/coding-standards.md). Today's violations are counted in ruff-baseline.json, which the
# ratchet (scripts/ratchet.ts) lets only shrink.
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C90", "PL", "SIM", "RUF", "UP", "N"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 4
max-statements = 40

# Coverage of the helpers, not the tests. The kernel and `python -m analysis_*` run as subprocesses in the tests, so
# coverage follows subprocesses.
[tool.coverage.run]
source = ["."]
# A virtual environment inside python/ (a stray `uv run` there makes one) is installed packages, not Assay's code.
omit = ["tests/*", "*/tests/*", ".venv/*", "*/.venv/*"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
# A helper in a folder without __init__.py still counts, at 0% if no test runs it.
include_namespace_packages = true
